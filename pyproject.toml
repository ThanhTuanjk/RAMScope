[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramscope"
version = "0.4.0"
description = "Defensive Windows memory forensics triage and correlation CLI built above Volatility3."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RAMScope contributors" }]
dependencies = ["typer>=0.12.0", "PyYAML>=6.0.0", "Jinja2>=3.1.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "types-reportlab>=4.0.0",
]
yara = ["yara-python>=4.5.0"]
volatility = ["volatility3>=2.7.0"]
tools = [
  "pefile>=2023.2.7",
  "flare-capa>=9.0.0",
  "flare-floss>=3.1.0; python_version < '3.13'",
]
pdf = ["reportlab>=4.0.0"]
full = [
  "volatility3>=2.7.0",
  "yara-python>=4.5.0",
  "pefile>=2023.2.7",
  "flare-capa>=9.0.0",
  "flare-floss>=3.1.0; python_version < '3.13'",
  "reportlab>=4.0.0",
]

[project.scripts]
ramscope = "ramscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ramscope = ["rules/*.yar", "rules/*.yara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yara", "pefile"]
ignore_missing_imports = true
