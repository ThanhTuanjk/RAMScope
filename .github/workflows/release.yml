name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - shell: bash
        run: sha256sum dist/* > SHA256SUMS.txt
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* SHA256SUMS.txt --title "RAMScope ${GITHUB_REF_NAME}" --prerelease --generate-notes
          fi
